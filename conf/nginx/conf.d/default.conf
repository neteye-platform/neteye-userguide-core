server {
    include /etc/nginx/conf.d/server/*.conf;

    # Locations that set their own add_header (e.g. CORS on /versions.json) keep the headers below.
    # Without this, nginx drops all server-level headers in those locations.
    add_header_inherit merge;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Single Content-Security-Policy for all pages. Per-page exceptions are set in csp.conf.
    # The sha256 source is the inline dark theme script in sphinx/theme/neteye-carbon/layout.html
    # and layout-home.html: if you change that script, update the hash here.
    add_header Content-Security-Policy "default-src 'self'; script-src https://1.www.s81c.com/common/carbon/ 'self' 'sha256-yNUERaDXTlvKaqgT14HBWxZ+GtzFbTSumQNpK9Ycve8=' analytics.neteye.cloud $csp_jira_collector; frame-src 'self' $csp_jira_collector; img-src 'self' data:; base-uri 'none'; connect-src 'self' search.neteye.guide analytics.neteye.cloud; style-src https://1.www.s81c.com/common/carbon/ 'self' 'unsafe-inline'" always;
}
