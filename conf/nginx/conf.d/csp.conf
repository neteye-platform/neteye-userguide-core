# Per-page exceptions to the Content-Security-Policy set in default.conf.
# Keep each exception limited to the pages that need it.

# Jira Issue Collector of the CRA incident report button (NUC-607).
# The collector loads its script and form from the Atlassian host. That host also serves JSONP,
# so it must never be allowed site-wide: allowing it would let injected markup run scripts.
# The pattern matches every documentation version. Versions without the button do not load
# the collector, so the exception has no effect on them.
map $uri $csp_jira_collector {
    default "";
    "~^/[^/]+/security-policy/cra-compliance\.html$" "https://siwuerthphoenix.atlassian.net";
}
